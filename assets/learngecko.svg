<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="lgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111a" />
      <stop offset="50%" stop-color="#0f1724" />
      <stop offset="100%" stop-color="#141c2c" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#lgBg)"/>

  <!-- Top System Bar -->
  <rect x="25" y="20" width="750" height="42" rx="10" fill="#152030" stroke="#22334c" stroke-width="1"/>
  <circle cx="48" cy="41" r="5.5" fill="#ef4444"/>
  <circle cx="68" cy="41" r="5.5" fill="#f59e0b"/>
  <circle cx="88" cy="41" r="5.5" fill="#10b981"/>
  <text x="114" y="45" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">LearnGecko — Reusable Component Library &amp; Breakpoint Suite</text>
  
  <rect x="595" y="29" width="165" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <text x="677" y="45" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">ACTIVE PRODUCTION SYSTEM</text>

  <!-- Left: Breakpoint Engine Showcase -->
  <g transform="translate(25, 76)">
    <rect width="450" height="395" rx="12" fill="#0f1624" stroke="#1f2c42" stroke-width="1"/>
    
    <!-- Header with viewport selectors -->
    <rect x="16" y="16" width="418" height="44" rx="8" fill="#182335"/>
    <text x="30" y="42" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">RESPONSIVE BREAKPOINT TUNING</text>
    
    <g transform="translate(230, 24)">
      <!-- Desktop pill active -->
      <rect x="0" y="0" width="56" height="26" rx="6" fill="#10b981"/>
      <text x="28" y="17" fill="#090a0f" font-family="sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">1440px</text>

      <rect x="62" y="0" width="56" height="26" rx="6" fill="#1e2a3c"/>
      <text x="90" y="17" fill="#94a3b8" font-family="sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">768px</text>

      <rect x="124" y="0" width="56" height="26" rx="6" fill="#1e2a3c"/>
      <text x="152" y="17" fill="#94a3b8" font-family="sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">375px</text>
    </g>

    <!-- Component Previews -->
    <!-- Card 1: Interactive Button Group -->
    <g transform="translate(16, 76)">
      <rect width="418" height="88" rx="8" fill="#152033" stroke="#22324e" stroke-width="1"/>
      <text x="16" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">COMPONENT: Interactive Action Button System</text>
      
      <g transform="translate(16, 38)">
        <rect x="0" y="0" width="115" height="34" rx="6" fill="url(#emeraldGrad)"/>
        <text x="57" y="21" fill="#090a0f" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Primary Solid</text>

        <rect x="125" y="0" width="125" height="34" rx="6" fill="transparent" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="187" y="21" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Secondary Outline</text>

        <rect x="260" y="0" width="125" height="34" rx="6" fill="#1e293b"/>
        <text x="322" y="21" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Ghost State</text>
      </g>
    </g>

    <!-- Card 2: Form & Input Field Component -->
    <g transform="translate(16, 178)">
      <rect width="418" height="96" rx="8" fill="#152033" stroke="#22324e" stroke-width="1"/>
      <text x="16" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">COMPONENT: Accessible Form Inputs &amp; Feedback</text>
      
      <g transform="translate(16, 38)">
        <rect x="0" y="0" width="185" height="38" rx="6" fill="#0d1420" stroke="#10b981" stroke-width="1.5"/>
        <text x="14" y="24" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">user@domain.com ✓</text>

        <rect x="198" y="0" width="185" height="38" rx="6" fill="#0d1420" stroke="#334155" stroke-width="1"/>
        <text x="212" y="24" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Placeholder text...</text>
      </g>
      <text x="16" y="86" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5">WCAG 2.1 AA Compliant • Keyboard Navigable • Screen Reader Ready</text>
    </g>

    <!-- Card 3: Code Spec Tagging -->
    <g transform="translate(16, 288)">
      <rect width="418" height="90" rx="8" fill="#121a2a" stroke="#1e2b40" stroke-width="1"/>
      <text x="16" y="22" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">TYPESCRIPT PROPS INTERFACE</text>
      <text x="16" y="42" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9.5">interface CardProps { variant: 'elevated' | 'flat'; responsive: boolean; }</text>
      <text x="16" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">export const ResponsiveCard: React.FC&lt;CardProps&gt; = ({ ... })</text>
      <text x="16" y="78" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9.5">✓ Zero runtime CSS leaks • Tailwind Atomic utility mappings</text>
    </g>
  </g>

  <!-- Right: Metrics & Impact -->
  <g transform="translate(495, 76)">
    <rect width="280" height="395" rx="12" fill="#0f1624" stroke="#1f2c42" stroke-width="1"/>
    
    <text x="18" y="32" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Engineering Impact</text>

    <g transform="translate(18, 48)">
      <rect width="244" height="88" rx="8" fill="#152033" stroke="#22334e" stroke-width="1"/>
      <text x="16" y="32" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800">100%</text>
      <text x="16" y="56" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700">Responsive Coverage</text>
      <text x="16" y="74" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Desktop, tablet, and mobile optimized</text>
    </g>

    <g transform="translate(18, 150)">
      <rect width="244" height="88" rx="8" fill="#152033" stroke="#22334e" stroke-width="1"/>
      <text x="16" y="32" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800">&lt; 0.01</text>
      <text x="16" y="56" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700">Cumulative Layout Shift</text>
      <text x="16" y="74" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Zero jarring page jumps on render</text>
    </g>

    <g transform="translate(18, 252)">
      <rect width="244" height="124" rx="8" fill="#152033" stroke="#22334e" stroke-width="1"/>
      <text x="16" y="24" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">CORE RESPONSIBILITIES</text>
      <text x="16" y="46" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">• Converted UI/UX to reusable components</text>
      <text x="16" y="66" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">• Cross-browser debugging &amp; testing</text>
      <text x="16" y="86" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">• Layout &amp; interaction smoothness</text>
      <text x="16" y="106" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">✓ Enhanced user-friendly site features</text>
    </g>
  </g>
</svg>
