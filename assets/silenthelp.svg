<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#101524" />
      <stop offset="100%" stop-color="#141a2e" />
    </linearGradient>
    <linearGradient id="calmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#24344d" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#shBg)"/>

  <!-- Top System Bar -->
  <rect x="25" y="20" width="750" height="42" rx="10" fill="#141b2a" stroke="#222e44" stroke-width="1"/>
  <circle cx="48" cy="41" r="5.5" fill="#ef4444"/>
  <circle cx="68" cy="41" r="5.5" fill="#f59e0b"/>
  <circle cx="88" cy="41" r="5.5" fill="#10b981"/>
  <text x="114" y="45" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">SilentHelp — AI-Powered Mental Health Assistance Platform</text>
  
  <rect x="615" y="29" width="145" height="24" rx="12" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="687" y="45" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">CALM ACCESSIBLE UI</text>

  <!-- Left: Conversational Guidance Interface -->
  <g transform="translate(25, 76)">
    <rect width="470" height="395" rx="12" fill="#0f1624" stroke="#1f2c42" stroke-width="1"/>
    
    <!-- Header with empathetic status -->
    <rect x="18" y="18" width="434" height="46" rx="8" fill="#172235"/>
    <circle cx="42" cy="41" r="12" fill="url(#calmGrad)"/>
    <path d="M42 35 C39 35 37 37 37 40 C37 44 42 47 42 47 C42 47 47 44 47 40 C47 37 45 35 42 35 Z" fill="#ffffff"/>
    <text x="64" y="37" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">AI Empathy Companion</text>
    <text x="64" y="52" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Non-judgmental, private, 24/7 conversational support</text>

    <!-- Chat Message 1 (AI) -->
    <g transform="translate(18, 80)">
      <rect width="360" height="56" rx="12" fill="url(#bubbleGrad)" stroke="#2b3b55" stroke-width="1"/>
      <text x="16" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">SILENTHELP COMPANION</text>
      <text x="16" y="43" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">"Welcome. Take a gentle breath. What's on your mind today?"</text>
    </g>

    <!-- Chat Message 2 (User) -->
    <g transform="translate(92, 148)">
      <rect width="360" height="52" rx="12" fill="#1e2a3f" stroke="#3b82f6" stroke-width="1"/>
      <text x="16" y="22" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">ANONYMOUS USER</text>
      <text x="16" y="40" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">"Feeling overwhelmed by upcoming exam pressure and late nights."</text>
    </g>

    <!-- Chat Message 3 (AI Guidance with Grounding) -->
    <g transform="translate(18, 212)">
      <rect width="434" height="96" rx="12" fill="url(#bubbleGrad)" stroke="#2b3b55" stroke-width="1"/>
      <text x="16" y="24" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">CALM DE-ESCALATION PATTERN</text>
      <text x="16" y="44" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">"That pressure is very valid. Let's do a simple 4-4-4 grounding exercise together:"</text>
      
      <g transform="translate(16, 56)">
        <rect x="0" y="0" width="124" height="24" rx="12" fill="#152033" stroke="#38bdf8" stroke-width="0.8"/>
        <text x="62" y="16" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">1. Inhale 4s</text>

        <rect x="134" y="0" width="124" height="24" rx="12" fill="#152033" stroke="#818cf8" stroke-width="0.8"/>
        <text x="196" y="16" fill="#a5b4fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">2. Hold 4s</text>

        <rect x="268" y="0" width="124" height="24" rx="12" fill="#152033" stroke="#34d399" stroke-width="0.8"/>
        <text x="330" y="16" fill="#6ee7b7" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">3. Exhale 4s</text>
      </g>
    </g>

    <!-- Input Box Simulation -->
    <g transform="translate(18, 322)">
      <rect width="434" height="52" rx="10" fill="#0c121d" stroke="#25354e" stroke-width="1"/>
      <text x="20" y="31" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Type what you feel... all messages remain local and private</text>
      <circle cx="406" cy="26" r="16" fill="url(#calmGrad)"/>
      <polygon points="402,20 412,26 402,32" fill="#ffffff"/>
    </g>
  </g>

  <!-- Right: Emotional Comfort & Hierarchy System -->
  <g transform="translate(515, 76)">
    <rect width="260" height="395" rx="12" fill="#0f1624" stroke="#1f2c42" stroke-width="1"/>

    <text x="18" y="32" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">UI/UX Comfort Principles</text>

    <!-- Pillar 1 -->
    <g transform="translate(18, 48)">
      <rect width="224" height="66" rx="8" fill="#152032" stroke="#22324c" stroke-width="1"/>
      <text x="12" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">SOFT VISUAL HIERARCHY</text>
      <text x="12" y="42" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5">High-contrast, non-jarring color palette designed to reduce anxiety.</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(18, 126)">
      <rect width="224" height="66" rx="8" fill="#152032" stroke="#22324c" stroke-width="1"/>
      <text x="12" y="22" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">MOBILE-FIRST ARCHITECTURE</text>
      <text x="12" y="42" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5">Thumb-zone reachable touch targets for rapid, stress-free interaction.</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(18, 204)">
      <rect width="224" height="66" rx="8" fill="#152032" stroke="#22324c" stroke-width="1"/>
      <text x="12" y="22" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">ANONYMITY &amp; TRUST</text>
      <text x="12" y="42" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5">Zero tracking scripts and local state isolation for vulnerable users.</text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(18, 286)">
      <rect width="224" height="90" rx="8" fill="#131c2d" stroke="#1f2c42" stroke-width="1"/>
      <text x="12" y="24" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">TECH ARSENAL</text>
      
      <g transform="translate(12, 36)">
        <rect x="0" y="0" width="60" height="20" rx="4" fill="#1e293b"/>
        <text x="30" y="14" fill="#38bdf8" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">React</text>

        <rect x="66" y="0" width="64" height="20" rx="4" fill="#1e293b"/>
        <text x="98" y="14" fill="#facc15" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">JavaScript</text>

        <rect x="136" y="0" width="56" height="20" rx="4" fill="#1e293b"/>
        <text x="164" y="14" fill="#e2e8f0" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">CSS3</text>
      </g>

      <text x="12" y="74" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">✓ Conversational AI Patterns</text>
    </g>
  </g>
</svg>
