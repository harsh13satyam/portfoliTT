<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ccBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b131f" />
      <stop offset="100%" stop-color="#112233" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#ccBg)"/>

  <!-- Top System Bar -->
  <rect x="30" y="24" width="740" height="42" rx="10" fill="#15273d" stroke="#1f3b5c" stroke-width="1"/>
  <circle cx="52" cy="45" r="6" fill="#ef4444"/>
  <circle cx="72" cy="45" r="6" fill="#f59e0b"/>
  <circle cx="92" cy="45" r="6" fill="#10b981"/>
  <text x="120" y="49" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="12">CrowdCare — Community Emergency &amp; Social Impact Network</text>
  
  <rect x="585" y="34" width="170" height="22" rx="11" fill="url(#gold)"/>
  <text x="670" y="49" fill="#78350f" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">🏆 TOP 50 / 500+ TEAMS</text>

  <!-- Left: Live Incident Map & Dispatch -->
  <rect x="30" y="80" width="490" height="395" rx="12" fill="#0c1726" stroke="#1f3b5c" stroke-width="1"/>

  <!-- Map grid overlay -->
  <g opacity="0.2" stroke="#38bdf8" stroke-width="1">
    <line x1="30" y1="160" x2="520" y2="160"/>
    <line x1="30" y1="240" x2="520" y2="240"/>
    <line x1="30" y1="320" x2="520" y2="320"/>
    <line x1="30" y1="400" x2="520" y2="400"/>
    <line x1="150" y1="80" x2="150" y2="475"/>
    <line x1="270" y1="80" x2="270" y2="475"/>
    <line x1="390" y1="80" x2="390" y2="475"/>
  </g>

  <!-- Map routes / connections -->
  <path d="M 120 280 Q 220 200 320 260 T 450 180" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="6,4"/>
  <path d="M 180 380 Q 280 340 320 260" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Pulse Pins -->
  <g transform="translate(320, 260)">
    <circle cx="0" cy="0" r="24" fill="#ef4444" opacity="0.25"/>
    <circle cx="0" cy="0" r="14" fill="#ef4444" opacity="0.6"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    <rect x="-65" y="-38" width="130" height="24" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
    <text x="0" y="-22" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Emergency Request</text>
  </g>

  <g transform="translate(120, 280)">
    <circle cx="0" cy="0" r="16" fill="#10b981" opacity="0.3"/>
    <circle cx="0" cy="0" r="6" fill="#10b981"/>
    <text x="0" y="24" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">Responder Unit 01</text>
  </g>

  <g transform="translate(450, 180)">
    <circle cx="0" cy="0" r="16" fill="#38bdf8" opacity="0.3"/>
    <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
    <text x="0" y="24" fill="#7dd3fc" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">Medical Facility A</text>
  </g>

  <!-- Floating Stats Card in Map -->
  <rect x="48" y="100" width="180" height="50" rx="8" fill="#15273d" stroke="#254366" stroke-width="1"/>
  <text x="60" y="120" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">DISPATCH LATENCY</text>
  <text x="60" y="138" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">&lt; 1.2s Real-Time</text>

  <!-- Right: Hackathon Win & Architecture -->
  <rect x="535" y="80" width="235" height="150" rx="12" fill="#15273d" stroke="#254366" stroke-width="1"/>
  <text x="555" y="110" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="800" text-transform="uppercase">Hackathon Recognition</text>
  <text x="555" y="132" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">3x Winner • 2x Finalist</text>
  <text x="555" y="152" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Ranked in Top 50 among 500+ national teams in the Social Impact Platform Challenge.</text>
  
  <rect x="555" y="180" width="195" height="34" rx="6" fill="#0f1f33" stroke="#254366" stroke-width="1"/>
  <text x="652" y="202" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Full-Stack MERN + Sockets</text>

  <rect x="535" y="245" width="235" height="230" rx="12" fill="#15273d" stroke="#254366" stroke-width="1"/>
  <text x="555" y="275" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="12">Key Engineering Feats</text>
  
  <text x="555" y="302" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Real-time geolocation tracking</text>
  <text x="555" y="324" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• High-concurrency socket channels</text>
  <text x="555" y="346" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Role-based responder access</text>
  <text x="555" y="368" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• MongoDB geospatial indexing</text>
  <text x="555" y="390" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Fast incident dispatch workflows</text>

  <rect x="555" y="415" width="195" height="42" rx="8" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="652" y="440" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Proven Scalability</text>
</svg>