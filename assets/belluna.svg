<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bellunaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#121824" />
      <stop offset="100%" stop-color="#181320" />
    </linearGradient>
    <linearGradient id="roseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glowDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" rx="16" fill="url(#bellunaBg)"/>

  <!-- Top Window Header Bar -->
  <rect x="25" y="20" width="750" height="42" rx="10" fill="#161d2b" stroke="#253248" stroke-width="1"/>
  <circle cx="48" cy="41" r="5.5" fill="#ef4444"/>
  <circle cx="68" cy="41" r="5.5" fill="#f59e0b"/>
  <circle cx="88" cy="41" r="5.5" fill="#10b981"/>
  <text x="114" y="45" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Belluna — Bilingual Women’s Health &amp; Emergency Triage App</text>
  
  <!-- Live Production Badge -->
  <rect x="620" y="29" width="140" height="24" rx="12" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1"/>
  <circle cx="635" cy="41" r="3.5" fill="#10b981"/>
  <text x="645" y="45" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700">LIVE APP DEPLOYED</text>

  <!-- LEFT PANEL: Cycle & Symptom Tracking Interface -->
  <g transform="translate(25, 76)">
    <rect width="360" height="395" rx="12" fill="#111723" stroke="#232f42" stroke-width="1"/>
    
    <!-- Header inside left card -->
    <rect x="16" y="16" width="328" height="48" rx="8" fill="#182132"/>
    <circle cx="40" cy="40" r="14" fill="rgba(244, 63, 94, 0.2)"/>
    <path d="M40 32 C36 32 33 35 33 39 C33 44 40 48 40 48 C40 48 47 44 47 39 C47 35 44 32 40 32 Z" fill="#f43f5e"/>
    <text x="64" y="36" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Cycle Phase: Ovulation</text>
    <text x="64" y="52" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Day 14 • High Fertility Window • Private RLS</text>

    <!-- Cycle Ring Visualization -->
    <g transform="translate(180, 150)">
      <circle cx="0" cy="0" r="64" fill="none" stroke="#1e293b" stroke-width="12"/>
      <circle cx="0" cy="0" r="64" fill="none" stroke="url(#roseGlow)" stroke-width="12" stroke-dasharray="320" stroke-dashoffset="120" stroke-linecap="round"/>
      <text x="0" y="-4" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" text-anchor="middle">Day 14</text>
      <text x="0" y="16" fill="#f43f5e" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">REGULAR</text>
    </g>

    <!-- Symptom Pills Grid -->
    <text x="18" y="246" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700">ACTIVE LOGGED SYMPTOMS</text>
    
    <g transform="translate(18, 258)">
      <rect x="0" y="0" width="98" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="49" y="17" fill="#f1f5f9" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">⚡ Energy: High</text>

      <rect x="106" y="0" width="108" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="160" y="17" fill="#f1f5f9" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">💧 Water: 2.5L</text>

      <rect x="222" y="0" width="102" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="273" y="17" fill="#f1f5f9" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">😊 Mood: Calm</text>
    </g>

    <!-- Confidential Security Bar -->
    <rect x="16" y="304" width="328" height="72" rx="8" fill="#141c2b" stroke="#1e293b" stroke-width="1"/>
    <text x="32" y="328" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">🔒 POSTGRESQL ROW LEVEL SECURITY (RLS)</text>
    <text x="32" y="348" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5">Encrypted zero-knowledge database schema ensuring only authenticated owners can query cycle records.</text>
    <rect x="250" y="356" width="84" height="16" rx="8" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="292" y="368" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">RLS ENFORCED</text>
  </g>

  <!-- RIGHT TOP: Bilingual AI Health Translator (Groq API + Zod) -->
  <g transform="translate(400, 76)">
    <rect width="375" height="190" rx="12" fill="#111723" stroke="#232f42" stroke-width="1"/>
    
    <rect x="16" y="14" width="343" height="30" rx="6" fill="#182234"/>
    <text x="28" y="34" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">⚡ GROQ API • AI TRANSLATOR</text>
    
    <!-- Language Toggle Badge -->
    <rect x="245" y="18" width="104" height="22" rx="11" fill="#25334c"/>
    <text x="270" y="33" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800">EN</text>
    <text x="294" y="33" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">|</text>
    <text x="318" y="33" fill="#f43f5e" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800">हिंदी</text>

    <!-- Query Prompt -->
    <rect x="16" y="54" width="343" height="42" rx="6" fill="#0d141f" stroke="#1f2c3f" stroke-width="1"/>
    <text x="26" y="73" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9.5">Input: "Severe lower abdominal pain with fever"</text>
    <text x="26" y="88" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9.5">Hinglish: "Pet ke nichle hisse mein tez dard aur bukhar"</text>

    <!-- Validated Output Box -->
    <rect x="16" y="106" width="343" height="70" rx="6" fill="rgba(16, 185, 129, 0.08)" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="125" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">✓ ZOD STRUCTURED VALIDATION PASSED</text>
    <text x="26" y="143" fill="#f1f5f9" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5">Triage Alert: Moderate risk detected. Recommended immediate consultation.</text>
    <text x="26" y="161" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Emergency Hotline &amp; Nearby Clinic dispatched to Leaflet Map.</text>
  </g>

  <!-- RIGHT BOTTOM: Leaflet + OpenStreetMap Clinic Finder -->
  <g transform="translate(400, 280)">
    <rect width="375" height="191" rx="12" fill="#111723" stroke="#232f42" stroke-width="1"/>
    
    <rect x="16" y="12" width="343" height="28" rx="6" fill="#182234"/>
    <text x="28" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">📍 LEAFLET + OPENSTREETMAP CLINIC LOCATOR</text>

    <!-- Mini Map Grid -->
    <g transform="translate(16, 48)">
      <rect width="343" height="96" rx="8" fill="#0c131d" stroke="#1b283b" stroke-width="1"/>
      
      <!-- Grid roads -->
      <line x1="0" y1="32" x2="343" y2="32" stroke="#1e2c3e" stroke-width="1"/>
      <line x1="0" y1="64" x2="343" y2="64" stroke="#1e2c3e" stroke-width="1"/>
      <line x1="90" y1="0" x2="90" y2="96" stroke="#1e2c3e" stroke-width="1"/>
      <line x1="210" y1="0" x2="210" y2="96" stroke="#1e2c3e" stroke-width="1"/>

      <!-- Navigation Route -->
      <path d="M 50 70 Q 120 40 210 50 T 290 25" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,3"/>

      <!-- User Pin -->
      <circle cx="50" cy="70" r="6" fill="#38bdf8"/>
      <circle cx="50" cy="70" r="14" fill="#38bdf8" opacity="0.25"/>

      <!-- Hospital Pin 1 -->
      <g transform="translate(290, 25)">
        <circle cx="0" cy="0" r="18" fill="#f43f5e" opacity="0.2"/>
        <circle cx="0" cy="0" r="8" fill="#f43f5e"/>
        <text x="0" y="3" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="900" text-anchor="middle">+</text>
      </g>
      
      <rect x="180" y="10" width="102" height="18" rx="4" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
      <text x="231" y="22" fill="#fecdd3" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Maternity Care • 1.2km</text>
    </g>

    <!-- Testing & Reliability Footer -->
    <g transform="translate(16, 154)">
      <rect width="165" height="26" rx="6" fill="#141c29" stroke="#1f2c3d" stroke-width="1"/>
      <text x="12" y="17" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">Vitest: 18/18 Passed</text>

      <rect x="178" y="0" width="165" height="26" rx="6" fill="#141c29" stroke="#1f2c3d" stroke-width="1"/>
      <text x="190" y="17" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">Overpass API: 200 OK</text>
    </g>
  </g>
</svg>
